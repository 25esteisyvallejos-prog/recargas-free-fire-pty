<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECARGAS FREE FIRE PTY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>🔥 RECARGAS FREE FIRE PTY</h1>
        <p>Compra diamantes para Free Fire de forma rápida y segura</p>

        <input type="text" id="jugador" placeholder="Nombre del jugador (opcional)">
        <input type="number" id="uid" placeholder="UID de Free Fire (Obligatorio)" required>

        <select id="diamantes">
            <option value="100 + 10 Diamantes ($1.25)">100 + 10 Diamantes — $1.25</option>
            <option value="310 + 31 Diamantes ($3.50)">310 + 31 Diamantes — $3.50</option>
            <option value="520 + 52 Diamantes ($5.75)">520 + 52 Diamantes — $5.75</option>
            <option value="1080 + 108 Diamantes ($11.25)">1080 + 108 Diamantes — $11.25</option>
            <option value="2080 + 218 Diamantes ($22.00)">2398 + 218 Diamantes — $22.00</option>
             <option value="5600 + 560 Diamantes ($54.00)">5600 + 560 Diamantes — $54.00</option>
            
        </select>

        <select id="pago">
            <option value="Yappy">Pagar con Yappy</option>
            <option value="Transferencia Bancaria">Transferencia Bancaria</option>
            <option value="Binance / USDT">Binance / USDT</option>
        </select>

        <button onclick="enviarPedido()">Comprar Diamantes</button>

        <p style="font-size: 11px; color: #aaa; margin-top: 12px;">
            ⚠️ Verifica bien tu UID antes de enviar. No hay reembolsos por IDs incorrectos.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
