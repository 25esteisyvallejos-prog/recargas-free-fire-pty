<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECARGAS FREE FIRE PTY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>🔥 RECARGAS FREE FIRE PTY</h1>
        <p>Compra diamantes para Free Fire de forma rápida y segura</p>

        <input type="text" id="jugador" placeholder="Nombre del jugador (opcional)">
        <input type="number" id="uid" placeholder="UID de Free Fire (Obligatorio)" required>

        <select id="diamantes">
            <option value="100 + 10 Diamantes ($0.80)">100 + 10 Diamantes — $0.80</option>
            <option value="341 + 10 Diamantes ($2.25)">342 + 10 Diamantes — $2.50</option>
            <option value="572 + 10 Diamantes ($4.20)">572 + 10 Diamantes — $4.25</option>
            <option value="1166 + 10 Diamantes ($8.00)">1166 + 10 Diamantes — $8.00</option>
            <option value="2398 + 10 Diamantes ($16.00)">2398 + 10 Diamantes — $16.00</option>
            <option value="Tarjeta Semanal ($2.25)">Tarjeta Semanal — $2.25</option>
            <option value="Tarjeta Mensual ($7.50)">Tarjeta Mensual — $7.50</option>
        </select>

        <select id="pago">
            <option value="Yappy">Pagar con Yappy</option>
            <option value="Transferencia Bancaria">Transferencia Bancaria</option>
            <option value="Binance / USDT">Binance / USDT</option>
        </select>

        <button onclick="enviarPedido()">Comprar Diamantes</button>

        <p style="font-size: 11px; color: #aaa; margin-top: 12px;">
            ⚠️ Verifica bien tu UID antes de enviar. No hay reembolsos por IDs incorrectos.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
