<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECARGAS FREE FIRE PTY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>🔥 RECARGAS FREE FIRE PTY</h1>
        <p>Compra diamantes para Free Fire de forma rápida y segura</p>

        <input type="text" id="jugador" placeholder="Nombre del jugador (opcional)">
        <input type="number" id="uid" placeholder="UID de Free Fire (Obligatorio)" required>

        <select id="diamantes">
            <option value="100 + 10 Diamantes ($1.00)">100 + 10 Diamantes — $1.00</option>
            <option value="310 + 31 Diamantes ($2.35)">310 + 31 Diamantes — $2.35</option>
            <option value="520 + 52 Diamantes ($3.96)">520 + 52 Diamantes — $3.96</option>
            <option value="1060 + 106 Diamantes ($7.55)">5600 + 560 Diamantes — $7.55</option>
            <option value="2180 + 218 Diamantes ($15.00)">1080 + 108 Diamantes — $15.00</option>
             <option value="5600 + 560 Diamantes ($35.88)">5600 + 560 Diamantes — $35.00</option>
            
        </select>

        <select id="pago">
            <option value="Yappy">Pagar con Yappy</option>
            <option value="Transferencia Bancaria">Transferencia Bancaria</option>
            <option value="Binance / USDT">Binance / USDT</option>
        </select>

        <button onclick="enviarPedido()">Comprar Diamantes</button>

        <p style="font-size: 11px; color: #aaa; margin-top: 12px;">
            ⚠️ Verifica bien tu UID antes de enviar. No hay reembolsos por IDs incorrectos.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
